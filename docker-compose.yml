version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - VITE_SIGNALING_URL=ws://signaling:4444
      - VITE_STUN_SERVERS=stun:stun.l.google.com:19302
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
    depends_on:
      - signaling
    networks:
      - mesh-net

  signaling:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    ports:
      - '${SIGNALING_PORT:-4444}:4444'
    environment:
      - PORT=4444
      - STUN_SERVER=stun:stun.l.google.com:19302
    networks:
      - mesh-net

  turn:
    image: coturn/coturn:latest
    ports:
      - '3478:3478'
      - '3478:3478/udp'
      - '5349:5349'
      - '5349:5349/udp'
      - '49152-65535:49152-65535/udp'
    environment:
      - TURN_PORT=3478
      - TURN_TLS_PORT=5349
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=65535
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me-in-production}
      - --realm=browser-agent-mesh
    networks:
      - mesh-net
    profiles:
      - full

networks:
  mesh-net:
    driver: bridge
